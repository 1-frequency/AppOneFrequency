<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Banking Admin - Komunitas Motor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen pb-20">

    <!-- TOAST NOTIFICATION KUSTOM -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-5">
        <div id="toast-content" class="bg-slate-900 border border-slate-700 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-xs font-bold">
            <span id="toast-icon">✅</span>
            <span id="toast-msg">Pesan notifikasi</span>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-lg font-bold text-orange-500">M-BANKING ADMIN</h1>
        <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg">Dashboard Utama</a>
    </header>

    <!-- Menu Tabs -->
    <div class="flex bg-slate-900 p-2 gap-1 border-b border-slate-800 max-w-lg mx-auto mt-4 rounded-2xl text-[10px] sm:text-xs">
        <button id="btn-keuangan" class="tab-btn flex-1 py-2 rounded-xl bg-orange-600 font-bold transition">Keuangan</button>
        <button id="btn-riwayat" class="tab-btn flex-1 py-2 rounded-xl bg-slate-800 text-slate-400 font-bold transition">Riwayat</button>
        <button id="btn-member" class="tab-btn flex-1 py-2 rounded-xl bg-slate-800 text-slate-400 font-bold transition">Member</button>
        <button id="btn-touring" class="tab-btn flex-1 py-2 rounded-xl bg-slate-800 text-slate-400 font-bold transition">Touring</button>
    </div>

    <main class="max-w-lg mx-auto p-4 space-y-6 mt-2">
        
        <!-- TAB 1: KEUANGAN -->
        <div id="tab-keuangan" class="page-tab space-y-6">
            <div class="bg-gradient-to-r from-orange-600 to-red-600 rounded-3xl p-6 shadow-xl">
                <p class="text-xs uppercase tracking-wider opacity-80">Total Saldo Kas</p>
                <h2 id="total-saldo" class="text-3xl font-extrabold mt-1">Rp 0</h2>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <button id="btn-modal-masuk" class="bg-emerald-600 hover:bg-emerald-700 py-3 rounded-xl font-bold text-sm shadow-lg">+ Uang Masuk</button>
                <button id="btn-modal-keluar" class="bg-rose-600 hover:bg-rose-700 py-3 rounded-xl font-bold text-sm shadow-lg">- Uang Keluar</button>
            </div>
        </div>

        <!-- TAB 2: RIWAYAT -->
        <div id="tab-riwayat" class="page-tab space-y-6 hidden">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Riwayat Pemasukan -->
                <div class="bg-slate-900 rounded-3xl p-5 border border-slate-800 shadow-lg">
                    <h3 class="font-bold text-emerald-400 mb-4 text-sm">Pemasukan</h3>
                    <div id="list-masuk" class="space-y-3">
                        <p class="text-xs text-slate-500">Memuat data...</p>
                    </div>
                </div>
                <!-- Riwayat Pengeluaran -->
                <div class="bg-slate-900 rounded-3xl p-5 border border-slate-800 shadow-lg">
                    <h3 class="font-bold text-rose-400 mb-4 text-sm">Pengeluaran</h3>
                    <div id="list-keluar" class="space-y-3">
                        <p class="text-xs text-slate-500">Memuat data...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 3: MEMBER -->
        <div id="tab-member" class="page-tab space-y-6 hidden">
            <!-- Tombol Trigger Modal Tambah Member -->
            <button id="btn-open-member-modal" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-2xl font-bold text-sm shadow-lg transition flex items-center justify-center gap-2">
                <span>+ Tambah Member</span>
            </button>
            
            <!-- Daftar Member Terdaftar (Dibatasi 6 item terlihat + Scroll) -->
            <div class="bg-slate-900 rounded-3xl p-5 border border-slate-800 shadow-lg">
                <h3 class="font-bold text-sm mb-3 text-slate-300">Daftar Member Terdaftar</h3>
                <div id="member-list" class="space-y-2 text-xs text-slate-400 max-h-[380px] overflow-y-auto pr-1">Memuat data member...</div>
            </div>
        </div>

        <!-- TAB 4: TOURING -->
        <div id="tab-touring" class="page-tab space-y-6 hidden">
            <div class="bg-slate-900 rounded-3xl p-5 border border-slate-800 shadow-lg">
                <h3 class="font-bold text-sm mb-4 text-orange-400">Buat Rencana Touring</h3>
                <form id="form-touring" class="space-y-3">
                    <input type="text" id="t-nama" autocomplete="off" placeholder="Nama Acara (Cth: Wajib Pangandaran)" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-sm" required>
                    <input type="text" id="t-tujuan" autocomplete="off" placeholder="Destinasi / Tujuan" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-sm" required>
                    <input type="number" id="t-budget" autocomplete="off" placeholder="Target Budget Kas (Rp)" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-sm" required>
                    <input type="date" id="t-tanggal" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-sm text-slate-300" required>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 py-3 rounded-xl font-bold text-sm shadow-lg">Simpan Plan Touring</button>
                </form>
            </div>

            <div class="bg-slate-900 rounded-3xl p-5 border border-slate-800 shadow-lg">
                <h3 class="font-bold text-sm mb-3 text-slate-300">Daftar Plan Touring</h3>
                <div id="touring-list" class="space-y-2 text-xs text-slate-400">Memuat data touring...</div>
            </div>
        </div>

    </main>

    <!-- MODAL TRANSAKSI -->
    <div id="modal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 w-full max-w-sm p-6 rounded-3xl border border-slate-800 space-y-4">
            <h3 id="modal-title" class="font-bold text-base text-orange-400">Input Transaksi</h3>
            <form id="form-transaksi" class="space-y-3">
                <input type="hidden" id="trans-type">
                <input type="hidden" id="trans-edit-id">
                <div>
                    <label class="text-xs text-slate-400">Jumlah (Rp)</label>
                    <input type="number" id="trans-amount" autocomplete="off" placeholder="50000" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-sm mt-1" required>
                </div>

                <!-- Field khusus Uang Masuk -->
                <div id="fields-masuk" class="space-y-3 hidden">
                    <div>
                        <label class="text-xs text-slate-400">Pilih Bulan & Tahun</label>
                        <input type="month" id="trans-month" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-sm mt-1 text-slate-300">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">Kategori</label>
                        <select id="trans-cat-select" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-sm mt-1 text-slate-300">
                            <option value="SESI 1">SESI 1</option>
                            <option value="SESI 2">SESI 2</option>
                            <option value="SESI 3">SESI 3</option>
                            <option value="SESI 4">SESI 4</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">Keterangan Tambahan (Pilih Member)</label>
                        <select id="trans-desc-select" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-sm mt-1 text-slate-300">
                            <option value="">-- Memuat Member --</option>
                        </select>
                    </div>
                </div>

                <!-- Field khusus Uang Keluar -->
                <div id="fields-keluar" class="space-y-3 hidden">
                    <div>
                        <label class="text-xs text-slate-400">Kategori</label>
                        <input type="text" id="trans-cat-input" autocomplete="off" placeholder="Cth: Konsumsi / Perbaikan" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-sm mt-1">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">Keterangan Tambahan</label>
                        <input type="text" id="trans-desc-input" autocomplete="off" placeholder="Cth: Beli sparepart" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-sm mt-1">
                    </div>
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="button" id="btn-batal" class="flex-1 py-3 bg-slate-800 rounded-xl text-xs font-bold">Batal</button>
                    <button type="submit" class="flex-1 py-3 bg-orange-600 hover:bg-orange-700 rounded-xl text-xs font-bold">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL TAMBAH / EDIT MEMBER -->
    <div id="modal-member" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 w-full max-w-sm p-6 rounded-3xl border border-slate-800 space-y-4">
            <h3 id="modal-member-title" class="font-bold text-base text-blue-400">Tambah Anggota Baru</h3>
            <form id="form-member" class="space-y-3">
                <input type="hidden" id="m-edit-id">
                <div>
                    <label class="text-xs text-slate-400">Nama Lengkap</label>
                    <input type="text" id="m-nama" autocomplete="off" placeholder="Masukkan nama lengkap" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-sm mt-1" required>
                </div>
                <div>
                    <label class="text-xs text-slate-400">NRA (Nomor Anggota)</label>
                    <input type="text" id="m-nra" autocomplete="off" placeholder="Cth: 0203" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-sm mt-1" required>
                </div>
                <div>
                    <label class="text-xs text-slate-400">Plat Nomor Kendaraan</label>
                    <input type="text" id="m-plat" autocomplete="off" placeholder="Cth: B 1234 ABC" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-sm mt-1">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" id="btn-batal-member" class="flex-1 py-3 bg-slate-800 rounded-xl text-xs font-bold">Batal</button>
                    <button type="submit" class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 rounded-xl text-xs font-bold">Simpan Member</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Utama -->
    <script>
    (function() {
        const db = window.supabase.createClient('https://phpjaseuurpguhtzdvwy.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBocGphc2V1dXJwZ3VodHpkdnd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODczNjYsImV4cCI6MjEwMjY2MzM2Nn0.DZvN_2ze96tgV3OuTWXpawe_g2YGWU7JWVJAfiQede4');

        // Fungsi Toast Notification Kustom
        function showNotification(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');
            const toastContent = document.getElementById('toast-content');

            toastMsg.innerText = message;
            if(type === 'success') {
                toastIcon.innerText = '✅';
                toastContent.className = 'bg-emerald-950/90 border border-emerald-500/50 text-emerald-200 px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-xs font-bold backdrop-blur-md';
            } else {
                toastIcon.innerText = '❌';
                toastContent.className = 'bg-rose-950/90 border border-rose-500/50 text-rose-200 px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-xs font-bold backdrop-blur-md';
            }

            toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-5');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-5');
            }, 3000);
        }

        async function loadKeuangan() {
            const { data } = await db.from('transactions').select('*').order('created_at', { ascending: false });
            let total = 0;
            const listMasuk = document.getElementById('list-masuk');
            const listKeluar = document.getElementById('list-keluar');
            if(!listMasuk || !listKeluar) return;

            listMasuk.innerHTML = '';
            listKeluar.innerHTML = '';

            if(!data || data.length === 0) {
                listMasuk.innerHTML = '<p class="text-xs text-slate-500">Belum ada pemasukan.</p>';
                listKeluar.innerHTML = '<p class="text-xs text-slate-500">Belum ada pengeluaran.</p>';
                document.getElementById('total-saldo').innerText = 'Rp 0';
                return;
            }

            let hasMasuk = false;
            let hasKeluar = false;

            data.forEach(t => {
                const amt = parseFloat(t.amount);
                const descText = t.description || '-';
                const catText = t.category || '-';

                if(t.type === 'masuk') {
                    hasMasuk = true;
                    total += amt;
                    listMasuk.innerHTML += `
                        <div class="bg-slate-800/50 p-3 rounded-2xl border border-slate-800 flex justify-between items-center text-xs space-x-2">
                            <div class="space-y-1 overflow-hidden">
                                <div class="flex items-center gap-2">
                                    <span class="font-bold text-slate-200">${catText}</span>
                                    <span class="font-bold text-emerald-400">+ Rp ${amt.toLocaleString()}</span>
                                </div>
                                <p class="text-[10px] text-slate-400 truncate">${descText}</p>
                            </div>
                            <div class="flex items-center gap-1.5 shrink-0">
                                <button onclick="window.editTransaction('${t.id}', '${t.type}', '${t.amount}', '${catText.replace(/'/g, "\\'")}', '${descText.replace(/'/g, "\\'")}')" class="bg-amber-600 hover:bg-amber-700 text-white px-2.5 py-1.5 rounded-lg text-[10px] font-bold transition">Edit</button>
                                <button onclick="window.deleteTransaction('${t.id}')" class="bg-rose-600 hover:bg-rose-700 text-white px-2.5 py-1.5 rounded-lg text-[10px] font-bold transition">Hapus</button>
                            </div>
                        </div>`;
                } else {
                    hasKeluar = true;
                    total -= amt;
                    listKeluar.innerHTML += `
                        <div class="bg-slate-800/50 p-3 rounded-2xl border border-slate-800 flex justify-between items-center text-xs space-x-2">
                            <div class="space-y-1 overflow-hidden">
                                <div class="flex items-center gap-2">
                                    <span class="font-bold text-slate-200">${catText}</span>
                                    <span class="font-bold text-rose-400">- Rp ${amt.toLocaleString()}</span>
                                </div>
                                <p class="text-[10px] text-slate-400 truncate">${descText}</p>
                            </div>
                            <div class="flex items-center gap-1.5 shrink-0">
                                <button onclick="window.editTransaction('${t.id}', '${t.type}', '${t.amount}', '${catText.replace(/'/g, "\\'")}', '${descText.replace(/'/g, "\\'")}')" class="bg-amber-600 hover:bg-amber-700 text-white px-2.5 py-1.5 rounded-lg text-[10px] font-bold transition">Edit</button>
                                <button onclick="window.deleteTransaction('${t.id}')" class="bg-rose-600 hover:bg-rose-700 text-white px-2.5 py-1.5 rounded-lg text-[10px] font-bold transition">Hapus</button>
                            </div>
                        </div>`;
                }
            });

            if(!hasMasuk) listMasuk.innerHTML = '<p class="text-xs text-slate-500">Belum ada pemasukan.</p>';
            if(!hasKeluar) listKeluar.innerHTML = '<p class="text-xs text-slate-500">Belum ada pengeluaran.</p>';

            document.getElementById('total-saldo').innerText = `Rp ${total.toLocaleString()}`;
        }

        async function loadMembers() {
            const { data } = await db.from('members').select('*').order('nama_lengkap');
            const list = document.getElementById('member-list');
            if(!list) return;
            list.innerHTML = data?.length ? '' : '<p class="text-slate-500 text-xs">Belum ada member.</p>';
            data?.forEach(m => {
                const platVal = m.plat_nomor ? m.plat_nomor : '';
                list.innerHTML += `
                    <div class="bg-slate-800/60 p-3 rounded-xl flex justify-between items-center text-slate-200 text-xs border border-slate-700/50">
                        <div class="space-y-0.5">
                            <p class="font-bold text-sm text-white">${m.nama_lengkap}</p>
                            <p class="text-[11px] text-slate-400">NRA: ${m.nra} | Plat: ${m.plat_nomor || '-'}</p>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button onclick="window.editMember('${m.id}', '${m.nama_lengkap.replace(/'/g, "\\'")}', '${m.nra}', '${platVal}')" class="bg-amber-600 hover:bg-amber-700 text-white px-2.5 py-1.5 rounded-lg text-[10px] font-bold transition">Edit</button>
                            <button onclick="window.deleteMember('${m.id}')" class="bg-rose-600 hover:bg-rose-700 text-white px-2.5 py-1.5 rounded-lg text-[10px] font-bold transition">Hapus</button>
                        </div>
                    </div>`;
            });
        }

        async function loadTouring() {
            const { data } = await db.from('touring_plans').select('*').order('tanggal_berangkat', { ascending: false });
            const list = document.getElementById('touring-list');
            if(!list) return;
            list.innerHTML = data?.length ? '' : '<p class="text-slate-500 text-xs">Belum ada plan touring.</p>';
            data?.forEach(t => {
                list.innerHTML += `<div class="bg-slate-800 p-2.5 rounded-xl space-y-1 text-slate-200 text-xs">
                    <p class="font-bold">${t.nama_acara} - <span class="text-orange-400">${t.tujuan}</span></p>
                    <p class="text-[10px] text-slate-400">Budget: Rp ${parseFloat(t.target_budget).toLocaleString()} | Berangkat: ${t.tanggal_berangkat}</p>
                </div>`;
            });
        }

        async function populateMemberDropdown() {
            const select = document.getElementById('trans-desc-select');
            if(!select) return;
            const { data } = await db.from('members').select('*').order('nama_lengkap');
            select.innerHTML = '<option value="">-- Pilih Member --</option>';
            if(data && data.length > 0) {
                data.forEach(m => {
                    select.innerHTML += `<option value="${m.nama_lengkap} (NRA: ${m.nra})">${m.nama_lengkap} (NRA: ${m.nra})</option>`;
                });
            } else {
                select.innerHTML = '<option value="">Belum ada member terdaftar</option>';
            }
        }

        async function openModal(type) {
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('trans-type').value = type;
            document.getElementById('trans-edit-id').value = '';
            const title = document.getElementById('modal-title');
            
            const fieldsMasuk = document.getElementById('fields-masuk');
            const fieldsKeluar = document.getElementById('fields-keluar');

            if (type === 'masuk') {
                title.innerText = 'Tambah Uang Masuk';
                title.className = 'font-bold text-base text-emerald-400';
                fieldsMasuk.classList.remove('hidden');
                fieldsKeluar.classList.add('hidden');

                document.getElementById('trans-month').required = true;
                document.getElementById('trans-cat-select').required = true;
                document.getElementById('trans-desc-select').required = true;
                document.getElementById('trans-cat-input').required = false;

                await populateMemberDropdown();
            } else {
                title.innerText = 'Tambah Uang Keluar';
                title.className = 'font-bold text-base text-rose-400';
                fieldsMasuk.classList.add('hidden');
                fieldsKeluar.classList.remove('hidden');

                document.getElementById('trans-month').required = false;
                document.getElementById('trans-cat-select').required = false;
                document.getElementById('trans-desc-select').required = false;
                document.getElementById('trans-cat-input').required = true;
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function openMemberModal() {
            document.getElementById('modal-member-title').innerText = 'Tambah Anggota Baru';
            document.getElementById('m-edit-id').value = '';
            document.getElementById('form-member').reset();
            document.getElementById('modal-member').classList.remove('hidden');
        }

        function closeMemberModal() {
            document.getElementById('modal-member').classList.add('hidden');
        }

        window.editMember = function(id, nama, nra, plat) {
            document.getElementById('modal-member-title').innerText = 'Edit Anggota';
            document.getElementById('m-edit-id').value = id;
            document.getElementById('m-nama').value = nama;
            document.getElementById('m-nra').value = nra;
            document.getElementById('m-plat').value = (plat && plat !== 'null') ? plat : '';
            document.getElementById('modal-member').classList.remove('hidden');
        };

        window.deleteMember = async function(id) {
            if(confirm('Apakah Anda yakin ingin menghapus member ini?')) {
                const { error } = await db.from('members').delete().eq('id', id);
                if(error) {
                    showNotification(error.message, 'error');
                } else {
                    showNotification('Member berhasil dihapus!', 'success');
                    loadMembers();
                }
            }
        };

        window.editTransaction = async function(id, type, amount, category, description) {
            await openModal(type);
            document.getElementById('trans-edit-id').value = id;
            document.getElementById('trans-amount').value = amount;
            
            const title = document.getElementById('modal-title');
            if (type === 'masuk') {
                title.innerText = 'Edit Uang Masuk';
                title.className = 'font-bold text-base text-emerald-400';
                document.getElementById('trans-cat-select').value = category;

                if (description.includes('Bulan:')) {
                    const parts = description.split(' | ');
                    if (parts.length >= 2) {
                        const monthPart = parts[0].replace('Bulan:', '').trim();
                        document.getElementById('trans-month').value = monthPart;

                        const memberPart = parts.slice(1).join(' | ').trim();
                        const descSelect = document.getElementById('trans-desc-select');
                        for (let option of descSelect.options) {
                            if (option.value === memberPart) {
                                descSelect.value = memberPart;
                                break;
                            }
                        }
                    }
                }
            } else {
                title.innerText = 'Edit Uang Keluar';
                title.className = 'font-bold text-base text-rose-400';
                document.getElementById('trans-cat-input').value = category;
                document.getElementById('trans-desc-input').value = description;
            }
        };

        window.deleteTransaction = async function(id) {
            if(confirm('Apakah Anda yakin ingin menghapus transaksi ini?')) {
                const { error } = await db.from('transactions').delete().eq('id', id);
                if(error) {
                    showNotification(error.message, 'error');
                } else {
                    showNotification('Transaksi berhasil dihapus!', 'success');
                    loadKeuangan();
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            loadKeuangan();

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.id.replace('btn-', '');
                    document.querySelectorAll('.page-tab').forEach(t => t.classList.add('hidden'));
                    document.querySelectorAll('.tab-btn').forEach(b => {
                        b.classList.remove('bg-orange-600', 'text-white');
                        b.classList.add('bg-slate-800', 'text-slate-400');
                    });
                    document.getElementById('tab-' + id)?.classList.remove('hidden');
                    e.target.classList.add('bg-orange-600', 'text-white');
                    e.target.classList.remove('bg-slate-800', 'text-slate-400');

                    if(id === 'riwayat' || id === 'keuangan') loadKeuangan();
                    if(id === 'member') loadMembers();
                    if(id === 'touring') loadTouring();
                });
            });

            document.getElementById('btn-open-member-modal').addEventListener('click', openMemberModal);
            document.getElementById('btn-batal-member').addEventListener('click', closeMemberModal);

            document.getElementById('btn-modal-masuk').addEventListener('click', () => openModal('masuk'));
            document.getElementById('btn-modal-keluar').addEventListener('click', () => openModal('keluar'));
            document.getElementById('btn-batal').addEventListener('click', closeModal);

            document.getElementById('form-member').addEventListener('submit', async (e) => {
                e.preventDefault();
                const editId = document.getElementById('m-edit-id').value;
                const nama = document.getElementById('m-nama').value;
                const nra = document.getElementById('m-nra').value;
                const plat = document.getElementById('m-plat').value;

                let error;
                if (editId) {
                    const res = await db.from('members').update({
                        nama_lengkap: nama,
                        nra: nra,
                        plat_nomor: plat
                    }).eq('id', editId);
                    error = res.error;
                } else {
                    const res = await db.from('members').insert([{
                        nama_lengkap: nama,
                        nra: nra,
                        plat_nomor: plat
                    }]);
                    error = res.error;
                }

                if(error) {
                    showNotification(error.message, 'error');
                } else { 
                    showNotification(editId ? 'Member berhasil diperbarui!' : 'Member berhasil disimpan!', 'success'); 
                    document.getElementById('form-member').reset(); 
                    document.getElementById('m-edit-id').value = '';
                    closeMemberModal(); 
                    loadMembers(); 
                }
            });

            document.getElementById('form-touring').addEventListener('submit', async (e) => {
                e.preventDefault();
                const { error } = await db.from('touring_plans').insert([{
                    nama_acara: document.getElementById('t-nama').value,
                    tujuan: document.getElementById('t-tujuan').value,
                    target_budget: document.getElementById('t-budget').value,
                    tanggal_berangkat: document.getElementById('t-tanggal').value
                }]);
                if(error) {
                    showNotification(error.message, 'error');
                } else { 
                    showNotification('Plan Touring berhasil disimpan!', 'success'); 
                    document.getElementById('form-touring').reset(); 
                    loadTouring(); 
                }
            });

            document.getElementById('form-transaksi').addEventListener('submit', async (e) => {
                e.preventDefault();
                const editId = document.getElementById('trans-edit-id').value;
                const type = document.getElementById('trans-type').value;
                let category, description;

                if (type === 'masuk') {
                    const monthVal = document.getElementById('trans-month').value;
                    const sesi = document.getElementById('trans-cat-select').value;
                    const memberDesc = document.getElementById('trans-desc-select').value;

                    category = sesi;
                    description = `Bulan: ${monthVal} | ${memberDesc}`;
                } else {
                    category = document.getElementById('trans-cat-input').value;
                    description = document.getElementById('trans-desc-input').value;
                }

                let error;
                if (editId) {
                    const res = await db.from('transactions').update({
                        type: type,
                        amount: document.getElementById('trans-amount').value,
                        category: category,
                        description: description
                    }).eq('id', editId);
                    error = res.error;
                } else {
                    const res = await db.from('transactions').insert([{
                        type: type,
                        amount: document.getElementById('trans-amount').value,
                        category: category,
                        description: description
                    }]);
                    error = res.error;
                }

                if(error) {
                    showNotification(error.message, 'error');
                } else { 
                    closeModal(); 
                    document.getElementById('form-transaksi').reset(); 
                    document.getElementById('trans-edit-id').value = '';
                    showNotification(editId ? 'Transaksi berhasil diperbarui!' : 'Transaksi berhasil disimpan!', 'success');
                    loadKeuangan(); 
                }
            });
        });
    })();
    </script>
</body>
</html>
