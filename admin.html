<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel M-Kas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-gray-100 p-5">
    <main class="max-w-2xl mx-auto space-y-8">
        
        <!-- Form Member -->
        <div class="bg-gray-800 p-6 rounded-xl">
            <h2 class="text-xl font-bold mb-4">Tambah Member</h2>
            <form id="form-member" class="space-y-3">
                <input type="text" id="m-nama" placeholder="Nama Lengkap" class="w-full p-2 bg-gray-700 rounded" required>
                <input type="text" id="m-nra" placeholder="NRA" class="w-full p-2 bg-gray-700 rounded" required>
                <input type="text" id="m-plat" placeholder="Plat Nomor" class="w-full p-2 bg-gray-700 rounded">
                <button type="submit" class="w-full bg-blue-600 p-2 rounded font-bold">Simpan Member</button>
            </form>
        </div>

        <!-- Form Transaksi Kas -->
        <div class="bg-gray-800 p-6 rounded-xl">
            <h2 class="text-xl font-bold mb-4">Input Kas (4 Sesi)</h2>
            <form id="form-kas" class="space-y-3">
                <select id="k-member" class="w-full p-2 bg-gray-700 rounded text-black" required></select>
                <select id="k-touring" class="w-full p-2 bg-gray-700 rounded text-black" required>
                    <option value="">-- Pilih Rencana Touring --</option>
                </select>
                <input type="number" id="k-jumlah" placeholder="Jumlah Bayar (Rp)" class="w-full p-2 bg-gray-700 rounded" required>
                <select id="k-sesi" class="w-full p-2 bg-gray-700 rounded text-black">
                    <option value="1">Sesi 1</option>
                    <option value="2">Sesi 2</option>
                    <option value="3">Sesi 3</option>
                    <option value="4">Sesi 4</option>
                </select>
                <input type="text" id="k-bukti" value="manual" class="w-full p-2 bg-gray-700 rounded" placeholder="URL Bukti Transfer">
                <button type="submit" class="w-full bg-green-600 p-2 rounded font-bold">Input Pembayaran</button>
            </form>
        </div>
    </main>

    <script>
        const supabase = window.supabase.createClient('https://phpjaseuurpguhtzdvwy.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBocGphc2V1dXJwZ3VodHpkdnd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODczNjYsImV4cCI6MjEwMjY2MzM2Nn0.DZvN_2ze96tgV3OuTWXpawe_g2YGWU7JWVJAfiQede4');

        // Load Data Dropdown
        async function loadData() {
            const { data: members } = await supabase.from('members').select('id, nama_lengkap');
            const { data: touring } = await supabase.from('touring_plans').select('id, nama_acara');
            
            const mSelect = document.getElementById('k-member');
            members?.forEach(m => mSelect.innerHTML += `<option value="${m.id}">${m.nama_lengkap}</option>`);
            
            const tSelect = document.getElementById('k-touring');
            touring?.forEach(t => tSelect.innerHTML += `<option value="${t.id}">${t.nama_acara}</option>`);
        }

        // Submit Member
        document.getElementById('form-member').onsubmit = async (e) => {
            e.preventDefault();
            await supabase.from('members').insert([{ nama_lengkap: document.getElementById('m-nama').value, nra: document.getElementById('m-nra').value, plat_nomor: document.getElementById('m-plat').value }]);
            alert('Sukses'); location.reload();
        };

        // Submit Kas
        document.getElementById('form-kas').onsubmit = async (e) => {
            e.preventDefault();
            const { error } = await supabase.from('kas_transactions').insert([{
                member_id: document.getElementById('k-member').value,
                touring_id: document.getElementById('k-touring').value,
                jumlah_bayar: document.getElementById('k-jumlah').value,
                sesi_pembayaran: document.getElementById('k-sesi').value,
                bukti_transfer_url: document.getElementById('k-bukti').value
            }]);
            error ? alert(error.message) : alert('Kas berhasil disimpan!');
        };

        loadData();
    </script>
</body>
</html>
