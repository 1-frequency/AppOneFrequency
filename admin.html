<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin - M-Kas Rider</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white flex h-screen">

    <!-- Sidebar -->
    <div class="w-64 bg-slate-900 p-6 space-y-6">
        <h1 class="text-xl font-bold text-orange-500">ADMIN PANEL</h1>
        <div class="space-y-2">
            <button onclick="show('member')" class="w-full text-left p-3 bg-slate-800 rounded">👥 Kelola Member</button>
            <button onclick="show('touring')" class="w-full text-left p-3 bg-slate-800 rounded">🏍️ Plan Touring</button>
            <button onclick="show('kas')" class="w-full text-left p-3 bg-slate-800 rounded">💰 Input Kas</button>
        </div>
        <a href="index.html" class="block text-center text-sm text-slate-400">Kembali ke Dashboard</a>
    </div>

    <!-- Main -->
    <div class="flex-1 p-10 overflow-y-auto">
        
        <!-- Form Member -->
        <div id="sec-member" class="space-y-4">
            <h2 class="text-2xl font-bold">Data Member</h2>
            <input type="text" id="m-nama" placeholder="Nama Lengkap" class="w-full p-3 bg-slate-800 rounded">
            <input type="text" id="m-nra" placeholder="NRA" class="w-full p-3 bg-slate-800 rounded">
            <button onclick="saveMember()" class="w-full bg-blue-600 p-3 rounded">Simpan Member</button>
        </div>

        <!-- Form Touring -->
        <div id="sec-touring" class="space-y-4 hidden">
            <h2 class="text-2xl font-bold">Rencana Touring</h2>
            <input type="text" id="t-nama" placeholder="Nama Acara" class="w-full p-3 bg-slate-800 rounded">
            <input type="text" id="t-tujuan" placeholder="Tujuan" class="w-full p-3 bg-slate-800 rounded">
            <input type="number" id="t-budget" placeholder="Target Budget" class="w-full p-3 bg-slate-800 rounded">
            <input type="date" id="t-tanggal" class="w-full p-3 bg-slate-800 rounded">
            <button onclick="saveTouring()" class="w-full bg-indigo-600 p-3 rounded">Simpan Touring</button>
        </div>

        <!-- Form Kas -->
        <div id="sec-kas" class="space-y-4 hidden">
            <h2 class="text-2xl font-bold">Input Kas</h2>
            <select id="k-member" class="w-full p-3 bg-slate-800 rounded text-white"></select>
            <select id="k-touring" class="w-full p-3 bg-slate-800 rounded text-white"></select>
            <input type="number" id="k-jumlah" placeholder="Jumlah Bayar" class="w-full p-3 bg-slate-800 rounded">
            <select id="k-sesi" class="w-full p-3 bg-slate-800 rounded text-white">
                <option value="1">Sesi 1</option><option value="2">Sesi 2</option>
                <option value="3">Sesi 3</option><option value="4">Sesi 4</option>
            </select>
            <button onclick="saveKas()" class="w-full bg-green-600 p-3 rounded">Input Pembayaran</button>
        </div>
    </div>

    <script>
        const supabase = window.supabase.createClient('https://phpjaseuurpguhtzdvwy.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBocGphc2V1dXJwZ3VodHpkdnd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODczNjYsImV4cCI6MjEwMjY2MzM2Nn0.DZvN_2ze96tgV3OuTWXpawe_g2YGWU7JWVJAfiQede4');

        function show(id) {
            document.getElementById('sec-member').classList.add('hidden');
            document.getElementById('sec-touring').classList.add('hidden');
            document.getElementById('sec-kas').classList.add('hidden');
            document.getElementById('sec-' + id).classList.remove('hidden');
            if(id === 'kas') loadDropdowns();
        }

        async function loadDropdowns() {
            const { data: m } = await supabase.from('members').select('id, nama_lengkap');
            const { data: t } = await supabase.from('touring_plans').select('id, nama_acara');
            const mSel = document.getElementById('k-member');
            const tSel = document.getElementById('k-touring');
            mSel.innerHTML = m.map(x => `<option value="${x.id}">${x.nama_lengkap}</option>`).join('');
            tSel.innerHTML = t.map(x => `<option value="${x.id}">${x.nama_acara}</option>`).join('');
        }

        async function saveMember() {
            await supabase.from('members').insert([{ nama_lengkap: document.getElementById('m-nama').value, nra: document.getElementById('m-nra').value }]);
            alert('Member Tersimpan!'); location.reload();
        }

        async function saveTouring() {
            await supabase.from('touring_plans').insert([{ nama_acara: document.getElementById('t-nama').value, tujuan: document.getElementById('t-tujuan').value, target_budget: document.getElementById('t-budget').value, tanggal_berangkat: document.getElementById('t-tanggal').value }]);
            alert('Touring Tersimpan!'); location.reload();
        }

        async function saveKas() {
            const { error } = await supabase.from('kas_transactions').insert([{ 
                member_id: document.getElementById('k-member').value, 
                touring_id: document.getElementById('k-touring').value, 
                jumlah_bayar: document.getElementById('k-jumlah').value,
                sesi_pembayaran: document.getElementById('k-sesi').value,
                bukti_transfer_url: 'N/A'
            }]);
            error ? alert(error.message) : alert('Kas Berhasil!');
        }
    </script>
</body>
</html>
