<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Banking Komunitas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4">

    <!-- Header Balance Card -->
    <div class="bg-gradient-to-r from-orange-600 to-red-600 rounded-3xl p-6 shadow-xl mb-6">
        <p class="text-orange-100 text-sm opacity-80">Total Saldo Kas</p>
        <h2 id="total-saldo" class="text-4xl font-bold mt-1">Rp 0</h2>
    </div>

    <!-- Quick Action Buttons -->
    <div class="grid grid-cols-2 gap-4 mb-8">
        <button onclick="openModal('masuk')" class="bg-green-600 py-3 rounded-xl font-bold">+ Uang Masuk</button>
        <button onclick="openModal('keluar')" class="bg-red-600 py-3 rounded-xl font-bold">- Uang Keluar</button>
    </div>

    <!-- History List -->
    <div class="bg-slate-900 rounded-3xl p-6 shadow-lg">
        <h3 class="font-bold mb-4">Riwayat Transaksi</h3>
        <div id="history-list" class="space-y-4">
            <!-- Data akan masuk di sini -->
        </div>
    </div>

    <!-- Modal Form -->
    <div id="modal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 w-full max-w-md p-6 rounded-3xl border border-slate-700">
            <h2 id="modal-title" class="text-xl font-bold mb-4">Input Transaksi</h2>
            <form id="form-transaksi" class="space-y-4">
                <input type="hidden" id="trans-type">
                <input type="number" id="trans-amount" placeholder="Jumlah (Rp)" class="w-full p-3 bg-slate-800 rounded-lg" required>
                <input type="text" id="trans-cat" placeholder="Kategori (Misal: Kas/Touring)" class="w-full p-3 bg-slate-800 rounded-lg" required>
                <input type="text" id="trans-desc" placeholder="Keterangan" class="w-full p-3 bg-slate-800 rounded-lg">
                <div class="flex gap-2">
                    <button type="button" onclick="closeModal()" class="flex-1 p-3 bg-slate-700 rounded-lg">Batal</button>
                    <button type="submit" class="flex-1 p-3 bg-orange-600 rounded-lg font-bold">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const supabase = window.supabase.createClient('https://phpjaseuurpguhtzdvwy.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBocGphc2V1dXJwZ3VodHpkdnd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODczNjYsImV4cCI6MjEwMjY2MzM2Nn0.DZvN_2ze96tgV3OuTWXpawe_g2YGWU7JWVJAfiQede4');

        async function loadData() {
            const { data } = await supabase.from('transactions').select('*').order('created_at', { ascending: false });
            let total = 0;
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            
            data?.forEach(t => {
                total += t.type === 'masuk' ? t.amount : -t.amount;
                list.innerHTML += `
                    <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                        <div>
                            <p class="font-bold">${t.category}</p>
                            <p class="text-xs text-slate-400">${t.description}</p>
                        </div>
                        <p class="font-bold ${t.type === 'masuk' ? 'text-green-500' : 'text-red-500'}">
                            ${t.type === 'masuk' ? '+' : '-'} Rp ${t.amount.toLocaleString()}
                        </p>
                    </div>`;
            });
            document.getElementById('total-saldo').innerText = `Rp ${total.toLocaleString()}`;
        }

        function openModal(type) {
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('trans-type').value = type;
            document.getElementById('modal-title').innerText = type === 'masuk' ? 'Tambah Uang Masuk' : 'Tambah Uang Keluar';
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        document.getElementById('form-transaksi').onsubmit = async (e) => {
            e.preventDefault();
            await supabase.from('transactions').insert([{
                type: document.getElementById('trans-type').value,
                amount: document.getElementById('trans-amount').value,
                category: document.getElementById('trans-cat').value,
                description: document.getElementById('trans-desc').value
            }]);
            closeModal();
            loadData();
        };

        loadData();
    </script>
</body>
</html>
