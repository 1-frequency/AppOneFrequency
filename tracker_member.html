<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Tracker - ONE Frequency</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: linear-gradient(135deg, rgba(31, 41, 55, 0.85), rgba(17, 24, 39, 0.95));
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }
        #map {
            height: 68vh;
            width: 100%;
            border-radius: 1.5rem;
            z-index: 1;
            transition: height 0.3s ease;
        }
        #panel-body {
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out, padding 0.3s ease-in-out;
            max-height: 250px;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen pb-8 selection:bg-orange-500 selection:text-white">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-gray-900/80 backdrop-blur-md border-b border-gray-800 px-6 py-3">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-lg font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-500">
                    MEMBER <span class="text-white">TRACKER One Frequency</span>
                </h1>
                <p class="text-[11px] text-gray-400 font-medium">Pantau Jejak Road Captain</p>
            </div>
            <a href="index.html" class="text-xs font-semibold bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-xl transition-all border border-gray-700">
                &larr; Kembali
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-3 sm:p-5 space-y-4">
        
        <!-- Panel Kontrol Member (Collapsible / Dropdown) -->
        <div class="glass-card rounded-2xl p-4 sm:p-5 space-y-3 shadow-xl">
            <!-- Header Panel & Toggle Button -->
            <div class="flex justify-between items-center cursor-pointer select-none" id="panel-toggle-header">
                <div class="flex items-center space-x-3">
                    <span class="text-[10px] font-bold uppercase tracking-widest text-blue-400 bg-blue-500/10 px-2.5 py-1 rounded-full border border-blue-500/20">
                        Pantau
                    </span>
                    <h2 class="text-sm sm:text-base font-bold text-white">Live Tracking Captain Road</h2>
                </div>
                <button type="button" id="btn-collapse-icon" class="text-gray-400 hover:text-white p-1.5 rounded-lg bg-gray-800/50 border border-gray-700/50 transition-transform duration-300">
                    <svg id="collapse-svg" class="w-4 h-4 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
            </div>

            <!-- Isi Panel Dropdown -->
            <div id="panel-body" class="space-y-3 pt-3 border-t border-gray-800/80">
                <div>
                    <label class="block text-xs text-gray-400 mb-1.5 font-medium">Pilih Jadwal Touring:</label>
                    <select id="select-touring" class="w-full bg-gray-900 border border-gray-700 text-gray-200 text-xs rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-blue-500 font-medium">
                        <option value="">-- Memuat Jadwal Touring --</option>
                    </select>
                </div>

                <!-- Status Indicator & Button -->
                <div class="pt-2 border-t border-gray-800/60 flex flex-col sm:flex-row justify-between items-center gap-3">
                    <div class="flex items-center space-x-2 w-full sm:w-auto">
                        <span id="status-indicator" class="w-2.5 h-2.5 rounded-full bg-gray-500"></span>
                        <span id="status-text" class="text-xs font-semibold text-gray-400">Status: Siap Memantau</span>
                    </div>

                    <button id="btn-toggle-watch" class="w-full sm:w-auto px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition-all shadow-lg flex items-center justify-center space-x-2">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        <span id="btn-text">Mulai Pantau Captain Road</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Peta Leaflet (Lebih Luas) -->
        <div class="glass-card p-2 rounded-3xl border border-gray-800 shadow-2xl">
            <div id="map"></div>
        </div>

    </main>

    <!-- CUSTOM NOTIFICATION MODAL -->
    <div id="custom-notification" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm hidden">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl w-full max-w-sm p-6 text-center space-y-4 shadow-2xl m-4">
            <div id="notif-icon-container" class="w-12 h-12 mx-auto rounded-full flex items-center justify-center bg-blue-500/10 text-blue-400 border border-blue-500/20">
                <svg id="notif-svg" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <div>
                <h3 id="notif-title" class="text-base font-bold text-white mb-1">Pemberitahuan</h3>
                <p id="notif-message" class="text-xs text-gray-300 leading-relaxed">-</p>
            </div>
            <button id="notif-btn-ok" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold transition-all shadow-md">
                Mengerti
            </button>
        </div>
    </div>

    <!-- SCRIPT UTAMA -->
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const SUPABASE_URL = 'https://phpjaseuurpguhtzdvwy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBocGphc2V1dXJwZ3VodHpkdnd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODczNjYsImV4cCI6MjEwMjY2MzM2Nn0.DZvN_2ze96tgV3OuTWXpawe_g2YGWU7JWVJAfiQede4';

        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let map;
        let memberMarker = null;
        let captainMarker = null;
        let captainRouteLine = null;
        let captainPathCoords = [];

        let watchInterval = null;
        let memberWatchId = null;
        let isWatching = false;

        // Toggle Collapse Panel Kontrol
        const panelToggleHeader = document.getElementById('panel-toggle-header');
        const panelBody = document.getElementById('panel-body');
        const collapseSvg = document.getElementById('collapse-svg');
        const mapElement = document.getElementById('map');
        let isCollapsed = false;

        panelToggleHeader.addEventListener('click', () => {
            isCollapsed = !isCollapsed;
            if (isCollapsed) {
                panelBody.style.maxHeight = '0px';
                panelBody.style.opacity = '0';
                panelBody.style.paddingTop = '0px';
                panelBody.style.paddingBottom = '0px';
                collapseSvg.style.transform = 'rotate(0deg)';
                mapElement.style.height = '84vh'; // Peta jadi sangat luas ke bawah
            } else {
                panelBody.style.maxHeight = '250px';
                panelBody.style.opacity = '1';
                panelBody.style.paddingTop = '0.75rem';
                collapseSvg.style.transform = 'rotate(180deg)';
                mapElement.style.height = '68vh'; // Tinggi peta kembali normal
            }
            setTimeout(() => { map.invalidateSize(); }, 300);
        });

        // Custom Notification Handler
        function showCustomNotification(title, message, isError = false) {
            const notifModal = document.getElementById('custom-notification');
            const notifTitle = document.getElementById('notif-title');
            const notifMsg = document.getElementById('notif-message');
            const iconContainer = document.getElementById('notif-icon-container');
            const notifSvg = document.getElementById('notif-svg');

            notifTitle.innerText = title;
            notifMsg.innerText = message;

            if (isError) {
                iconContainer.className = "w-12 h-12 mx-auto rounded-full flex items-center justify-center bg-rose-500/10 text-rose-400 border border-rose-500/20";
                notifSvg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>';
            } else {
                iconContainer.className = "w-12 h-12 mx-auto rounded-full flex items-center justify-center bg-blue-500/10 text-blue-400 border border-blue-500/20";
                notifSvg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>';
            }
            notifModal.classList.remove('hidden');
        }

        document.getElementById('notif-btn-ok').addEventListener('click', () => {
            document.getElementById('custom-notification').classList.add('hidden');
        });

        // Inisialisasi Peta Leaflet
        function initMap(lat = -6.2088, lng = 106.8456) {
            map = L.map('map').setView([lat, lng], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            captainRouteLine = L.polyline([], {
                color: '#2563eb',
                weight: 5,
                opacity: 0.85
            }).addTo(map);
        }

        initMap();

        // Ambil Daftar Jadwal Touring dari Database
        async function fetchTouringSchedules() {
            try {
                const { data, error } = await db
                    .from('touring_plans')
                    .select('id, nama_acara, tujuan')
                    .order('tanggal_berangkat', { ascending: true });

                if (error) throw error;

                const select = document.getElementById('select-touring');
                select.innerHTML = '<option value="">-- Pilih Jadwal Touring --</option>';

                if (data && data.length > 0) {
                    data.forEach(t => {
                        const opt = document.createElement('option');
                        opt.value = t.id;
                        opt.textContent = `${t.nama_acara} (${t.tujuan})`;
                        select.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error("Gagal mengambil jadwal touring:", err.message);
            }
        }

        fetchTouringSchedules();

        // Ambil Posisi Road Captain dan Rekam Jejak Jalurnya
        async function fetchCaptainLocation(touringId) {
            try {
                const { data, error } = await db
                    .from('live_tracking')
                    .select('latitude, longitude')
                    .eq('touring_id', touringId)
                    .single();

                if (error) throw error;

                if (data && data.latitude && data.longitude) {
                    const captainCoords = [data.latitude, data.longitude];

                    const lastPoint = captainPathCoords[captainPathCoords.length - 1];
                    if (!lastPoint || lastPoint[0] !== captainCoords[0] || lastPoint[1] !== captainCoords[1]) {
                        captainPathCoords.push(captainCoords);
                        captainRouteLine.setLatLngs(captainPathCoords);
                    }

                    if (!captainMarker) {
                        captainMarker = L.marker(captainCoords, {
                            icon: L.divIcon({
                                className: 'custom-captain-marker',
                                html: '<div style="background-color: #f97316; width: 16px; height: 16px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5);"></div>',
                                iconSize: [16, 16]
                            })
                        }).addTo(map).bindPopup("<b>Road Captain (Konvoi)</b>");
                    } else {
                        captainMarker.setLatLng(captainCoords);
                    }
                }
            } catch (err) {
                console.log("Menunggu sinyal Road Captain...");
            }
        }

        // Tombol Mulai/Berhenti Pantau
        const btnToggle = document.getElementById('btn-toggle-watch');
        const btnText = document.getElementById('btn-text');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');
        const selectTouring = document.getElementById('select-touring');

        btnToggle.addEventListener('click', () => {
            const touringId = selectTouring.value;
            if (!touringId) {
                showCustomNotification('Perhatian', 'Pilih jadwal touring terlebih dahulu.', true);
                return;
            }

            if (!isWatching) {
                if (!navigator.geolocation) {
                    showCustomNotification('Gagal', 'Browser Anda tidak mendukung Geolocation.', true);
                    return;
                }

                isWatching = true;
                captainPathCoords = [];
                captainRouteLine.setLatLngs([]);

                btnText.innerText = 'Berhenti Pantau';
                btnToggle.className = "w-full sm:w-auto px-5 py-2.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-bold transition-all shadow-lg flex items-center justify-center space-x-2";
                statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                statusText.innerText = 'Status: Merekam & Memantau Jalur...';
                selectTouring.disabled = true;

                memberWatchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const memberCoords = [position.coords.latitude, position.coords.longitude];

                        if (!memberMarker) {
                            memberMarker = L.marker(memberCoords, {
                                icon: L.divIcon({
                                    className: 'custom-member-marker',
                                    html: '<div style="background-color: #3b82f6; width: 16px; height: 16px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5);"></div>',
                                    iconSize: [16, 16]
                                })
                            }).addTo(map).bindPopup("<b>Posisi Anda (Member)</b>").openPopup();
                            map.setView(memberCoords, 14);
                        } else {
                            memberMarker.setLatLng(memberCoords);
                        }
                    },
                    (error) => { console.log("GPS member error: " + error.message); },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
                );

                fetchCaptainLocation(touringId);
                watchInterval = setInterval(() => {
                    fetchCaptainLocation(touringId);
                }, 4000);

            } else {
                if (memberWatchId !== null) {
                    navigator.geolocation.clearWatch(memberWatchId);
                    memberWatchId = null;
                }
                if (watchInterval !== null) {
                    clearInterval(watchInterval);
                    watchInterval = null;
                }

                isWatching = false;
                btnText.innerText = 'Mulai Pantau & Rekam Rute';
                btnToggle.className = "w-full sm:w-auto px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition-all shadow-lg flex items-center justify-center space-x-2";
                statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-gray-500";
                statusText.innerText = 'Status: Pemantauan Dihentikan';
                selectTouring.disabled = false;
            }
        });
    });
    </script>
</body>
</html>
