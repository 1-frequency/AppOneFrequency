<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Tracker - ONE Frequency</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: linear-gradient(135deg, rgba(31, 41, 55, 0.8), rgba(17, 24, 39, 0.9));
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }
        #map {
            height: 70vh;
            width: 100%;
            border-radius: 1.5rem;
            z-index: 1;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen pb-12 selection:bg-orange-500 selection:text-white">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-gray-900/80 backdrop-blur-md border-b border-gray-800 px-6 py-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-500">
                    MEMBER <span class="text-white">TRACKER</span>
                </h1>
                <p class="text-xs text-gray-400 font-medium">Pantau Posisi Konvoi Road Captain</p>
            </div>
            <a href="index.html" class="text-xs font-semibold bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-2 rounded-xl transition-all border border-gray-700">
                &larr; Kembali ke Dashboard
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">
        
        <!-- Panel Kontrol Member -->
        <div class="glass-card rounded-3xl p-6 space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <span class="text-xs font-bold uppercase tracking-widest text-blue-400 bg-blue-500/10 px-3 py-1 rounded-full border border-blue-500/20">
                        Mode Pantau Peta
                    </span>
                    <h2 class="text-xl font-black mt-2 text-white">Live Tracking Konvoi</h2>
                    <p class="text-xs text-gray-400 mt-1">Pilih jadwal touring untuk melihat posisi dan jejak rute Road Captain.</p>
                </div>

                <div class="w-full sm:w-auto">
                    <select id="select-touring" class="w-full sm:w-64 bg-gray-900 border border-gray-700 text-gray-200 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-blue-500 font-medium">
                        <option value="">-- Memuat Jadwal Touring --</option>
                    </select>
                </div>
            </div>

            <!-- Status Indicator & Button -->
            <div class="pt-3 border-t border-gray-800 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center space-x-2">
                    <span id="status-indicator" class="w-3 h-3 rounded-full bg-gray-500"></span>
                    <span id="status-text" class="text-xs font-semibold text-gray-400">Status: Siap Memantau</span>
                </div>

                <button id="btn-toggle-watch" class="w-full sm:w-auto px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition-all shadow-lg flex items-center justify-center space-x-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    <span id="btn-text">Mulai Pantau</span>
                </button>
            </div>
        </div>

        <!-- Peta Leaflet -->
        <div class="glass-card p-3 rounded-3xl border border-gray-800 shadow-2xl">
            <div id="map"></div>
        </div>

    </main>

    <!-- CUSTOM NOTIFICATION MODAL -->
    <div id="custom-notification" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm hidden">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl w-full max-w-sm p-6 text-center space-y-4 shadow-2xl m-4">
            <div id="notif-icon-container" class="w-12 h-12 mx-auto rounded-full flex items-center justify-center bg-blue-500/10 text-blue-400 border border-blue-500/20">
                <svg id="notif-svg" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <div>
                <h3 id="notif-title" class="text-base font-bold text-white mb-1">Pemberitahuan</h3>
                <p id="notif-message" class="text-xs text-gray-300 leading-relaxed">-</p>
            </div>
            <button id="notif-btn-ok" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold transition-all shadow-md">
                Mengerti
            </button>
        </div>
    </div>

    <!-- SCRIPT UTAMA -->
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const SUPABASE_URL = 'https://phpjaseuurpguhtzdvwy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBocGphc2V1dXJwZ3VodHpkdnd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODczNjYsImV4cCI6MjEwMjY2MzM2Nn0.DZvN_2ze96tgV3OuTWXpawe_g2YGWU7JWVJAfiQede4';

        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let map;
        let marker;
        let routePolyline;
        let routeCoordinates = [];
        let watchInterval = null;
        let isWatching = false;

        // Custom Notification Handler
        function showCustomNotification(title, message, isError = false) {
            const notifModal = document.getElementById('custom-notification');
            const notifTitle = document.getElementById('notif-title');
            const notifMsg = document.getElementById('notif-message');
            const iconContainer = document.getElementById('notif-icon-container');
            const notifSvg = document.getElementById('notif-svg');

            notifTitle.innerText = title;
            notifMsg.innerText = message;

            if (isError) {
                iconContainer.className = "w-12 h-12 mx-auto rounded-full flex items-center justify-center bg-rose-500/10 text-rose-400 border border-rose-500/20";
                notifSvg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>';
            } else {
                iconContainer.className = "w-12 h-12 mx-auto rounded-full flex items-center justify-center bg-blue-500/10 text-blue-400 border border-blue-500/20";
                notifSvg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>';
            }
            notifModal.classList.remove('hidden');
        }

        document.getElementById('notif-btn-ok').addEventListener('click', () => {
            document.getElementById('custom-notification').classList.add('hidden');
        });

        // Inisialisasi Peta Leaflet & Polyline Garis Biru
        function initMap(lat = -6.2088, lng = 106.8456) {
            map = L.map('map').setView([lat, lng], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            // Membuat garis rute berwarna biru (gaya navigasi GPS)
            routePolyline = L.polyline([], {
                color: '#2563eb', // Warna biru terang (Tailwind Blue 600)
                weight: 5,         // Ketebalan garis
                opacity: 0.8,
                smoothFactor: 1
            }).addTo(map);

            marker = L.marker([lat, lng]).addTo(map)
                .bindPopup("<b>Posisi Road Captain (Konvoi)</b>")
                .openPopup();
        }

        initMap();

        // Ambil Daftar Jadwal Touring dari Database
        async function fetchTouringSchedules() {
            try {
                const { data, error } = await db
                    .from('touring_plans')
                    .select('id, nama_acara, tujuan')
                    .order('tanggal_berangkat', { ascending: true });

                if (error) throw error;

                const select = document.getElementById('select-touring');
                select.innerHTML = '<option value="">-- Pilih Jadwal Touring --</option>';

                if (data && data.length > 0) {
                    data.forEach(t => {
                        const opt = document.createElement('option');
                        opt.value = t.id;
                        opt.textContent = `${t.nama_acara} (${t.tujuan})`;
                        select.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error("Gagal mengambil jadwal touring:", err.message);
            }
        }

        fetchTouringSchedules();

        // Fungsi Mengambil Posisi Road Captain dan Menggambar Jejak Garis Biru
        async function fetchCaptainLocation(touringId) {
            try {
                const { data, error } = await db
                    .from('live_tracking')
                    .select('latitude, longitude, updated_at')
                    .eq('touring_id', touringId)
                    .single();

                if (error) throw error;

                if (data && data.latitude && data.longitude) {
                    const lat = data.latitude;
                    const lng = data.longitude;

                    // Tambahkan titik baru ke riwayat rute jika berbeda dari titik terakhir
                    const lastPoint = routeCoordinates[routeCoordinates.length - 1];
                    if (!lastPoint || lastPoint[0] !== lat || lastPoint[1] !== lng) {
                        routeCoordinates.push([lat, lng]);
                        routePolyline.setLatLngs(routeCoordinates); // Perbarui tampilan garis di peta
                    }

                    // Pindahkan marker dan pusatkan peta ke posisi terbaru Road Captain
                    marker.setLatLng([lat, lng]);
                    map.setView([lat, lng], map.getZoom());
                    document.getElementById('status-text').innerText = `Status: Terhubung (Live Tracking Aktif)`;
                }
            } catch (err) {
                console.log("Menunggu sinyal dari Road Captain...");
            }
        }

        // Tombol Mulai/Berhenti Pantau
        const btnToggle = document.getElementById('btn-toggle-watch');
        const btnText = document.getElementById('btn-text');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');
        const selectTouring = document.getElementById('select-touring');

        btnToggle.addEventListener('click', () => {
            const touringId = selectTouring.value;
            if (!touringId) {
                showCustomNotification('Perhatian', 'Pilih jadwal touring terlebih dahulu untuk mulai memantau.', true);
                return;
            }

            if (!isWatching) {
                isWatching = true;
                routeCoordinates = []; // Reset jejak rute saat mulai baru
                routePolyline.setLatLngs([]);

                btnText.innerText = 'Berhenti Pantau';
                btnToggle.className = "w-full sm:w-auto px-6 py-2.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-bold transition-all shadow-lg flex items-center justify-center space-x-2";
                statusIndicator.className = "w-3 h-3 rounded-full bg-emerald-500 animate-pulse";
                statusText.innerText = 'Status: Memantau Road Captain...';
                selectTouring.disabled = true;

                // Ambil data pertama kali seketika
                fetchCaptainLocation(touringId);

                // Polling data setiap 4 detik sekali dari database
                watchInterval = setInterval(() => {
                    fetchCaptainLocation(touringId);
                }, 4000);

            } else {
                if (watchInterval !== null) {
                    clearInterval(watchInterval);
                    watchInterval = null;
                }

                isWatching = false;
                btnText.innerText = 'Mulai Pantau';
                btnToggle.className = "w-full sm:w-auto px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition-all shadow-lg flex items-center justify-center space-x-2";
                statusIndicator.className = "w-3 h-3 rounded-full bg-gray-500";
                statusText.innerText = 'Status: Pemantauan Dihentikan';
                selectTouring.disabled = false;
            }
        });
    });
    </script>
</body>
</html>
