<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneFrequency - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-gray-900/80 backdrop-blur-md border-b border-gray-800 px-6 py-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-500">ONE Frequency</h1>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">
        
        <!-- SECTION 1: DASHBOARD INFO -->
        <section class="glass-card rounded-3xl p-6 border border-gray-800">
            <h2 class="text-2xl font-black text-white" id="touring-name">Memuat...</h2>
            <div class="grid grid-cols-2 gap-4 mt-4 text-sm">
                <div><p class="text-gray-400">Saldo</p><p class="text-cyan-400 font-bold" id="saldo-saat-ini">Rp 0</p></div>
                <div><p class="text-gray-400">Peserta</p><p class="text-orange-400 font-bold"><span id="count-peserta">0</span> Orang</p></div>
            </div>
        </section>

        <!-- SECTION 2: MENU AKSI -->
        <section class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <button id="btn-toggle-rekap" class="bg-gray-800 hover:bg-gray-700 text-white py-3 rounded-xl font-semibold border border-gray-700 transition">
                Lihat Rekap Kas
            </button>
            <button id="btn-open-modal" class="bg-orange-600 hover:bg-orange-500 text-white py-3 rounded-xl font-semibold shadow-lg shadow-orange-900/20 transition">
                Daftar Peserta Touring
            </button>
        </section>

        <!-- SECTION 3: REKAP KAS (DIBUAT HIDDEN DEFAULT) -->
        <section id="container-rekap-kas" class="space-y-4 hidden animate-in fade-in duration-300">
            <div class="flex flex-wrap gap-2">
                <select id="filter-sesi" class="bg-gray-900 border border-gray-800 text-xs rounded-lg px-3 py-2"><option value="semua">Semua Sesi</option><option value="1">Sesi 1</option><option value="2">Sesi 2</option><option value="3">Sesi 3</option></select>
                <!-- Tambahkan filter lainnya di sini jika perlu -->
            </div>
            <div class="overflow-x-auto glass-card rounded-2xl border border-gray-800">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-900/60 text-gray-400 uppercase text-xs border-b border-gray-800">
                        <tr><th class="p-4">Member</th><th class="p-4">Total Kas</th><th class="p-4">Status</th></tr>
                    </thead>
                    <tbody id="kas-table-body" class="divide-y divide-gray-800"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- MODAL PESERTA -->
    <div id="modal-peserta" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden">
        <div class="bg-gray-900 border border-gray-800 rounded-3xl w-full max-w-lg p-6 m-4 max-h-[85vh] flex flex-col">
            <h3 class="text-lg font-bold text-white mb-4">Checklist Kehadiran</h3>
            <div id="modal-member-list" class="overflow-y-auto flex-1 space-y-3"></div>
            <div class="border-t border-gray-800 pt-4 flex justify-end gap-3">
                <button id="btn-cancel-modal" class="px-4 py-2 bg-gray-800 rounded-xl text-xs font-bold">Batal</button>
                <button id="btn-save-peserta" class="px-4 py-2 bg-orange-600 rounded-xl text-xs font-bold">Simpan Kehadiran</button>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const SUPABASE_URL = 'https://phpjaseuurpguhtzdvwy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBocGphc2V1dXJwZ3VodHpkdnd5Iiwicm9sZSI6InBhbm9uIiwiaWF0IjoxNzg3MDg3MzY2LCJleHAiOjIxMDI2NjMzNjZ9.DZvN_2ze96tgV3OuTWXpawe_g2YGWU7JWVJAfiQede4';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Logic Toggle Rekap Kas
        const btnToggleRekap = document.getElementById('btn-toggle-rekap');
        const containerRekap = document.getElementById('container-rekap-kas');
        btnToggleRekap.addEventListener('click', () => {
            containerRekap.classList.toggle('hidden');
            btnToggleRekap.innerText = containerRekap.classList.contains('hidden') ? 'Lihat Rekap Kas' : 'Tutup Rekap Kas';
        });

        // Modal Logic (Sama seperti sebelumnya)
        const modal = document.getElementById('modal-peserta');
        document.getElementById('btn-open-modal').addEventListener('click', () => modal.classList.remove('hidden'));
        document.getElementById('btn-cancel-modal').addEventListener('click', () => modal.classList.add('hidden'));

        // ... (Sisa kode fungsi fetch data, render, dan simpan tetap sama dengan versi sebelumnya) ...
        // Pastikan fungsi fetchTouringData dan fetchKasData dipanggil di bawah ini
        // fetchTouringData(); fetchKasData();
    });
    </script>
</body>
</html>
