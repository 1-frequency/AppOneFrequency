<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Captain Live Tracker - ONE Frequency</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: linear-gradient(135deg, rgba(31, 41, 55, 0.8), rgba(17, 24, 39, 0.9));
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }
        #map {
            height: 70vh;
            width: 100%;
            border-radius: 1.5rem;
            z-index: 1;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen pb-12 selection:bg-orange-500 selection:text-white">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-gray-900/80 backdrop-blur-md border-b border-gray-800 px-6 py-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-500">
                    ROAD CAPTAIN <span class="text-white">TRACKER</span>
                </h1>
                <p class="text-xs text-gray-400 font-medium">ONE Frequency Live Broadcast</p>
            </div>
            <a href="index.html" class="text-xs font-semibold bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-2 rounded-xl transition-all border border-gray-700">
                &larr; Kembali ke Dashboard
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">
        
        <!-- Panel Kontrol Road Captain -->
        <div class="glass-card rounded-3xl p-6 space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <span class="text-xs font-bold uppercase tracking-widest text-orange-400 bg-orange-500/10 px-3 py-1 rounded-full border border-orange-500/20">
                        Mode Siaran GPS
                    </span>
                    <h2 class="text-xl font-black mt-2 text-white">Transmisi Lokasi Konvoi</h2>
                    <p class="text-xs text-gray-400 mt-1">Pilih jadwal touring aktif lalu mulai siarkan posisi Anda di jalan.</p>
                </div>

                <div class="w-full sm:w-auto">
                    <select id="select-touring" class="w-full sm:w-64 bg-gray-900 border border-gray-700 text-gray-200 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-orange-500 font-medium">
                        <option value="">-- Memuat Jadwal Touring --</option>
                    </select>
                </div>
            </div>

            <!-- Status Indicator & Button -->
            <div class="pt-3 border-t border-gray-800 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center space-x-2">
                    <span id="status-indicator" class="w-3 h-3 rounded-full bg-gray-500"></span>
                    <span id="status-text" class="text-xs font-semibold text-gray-400">Status: Siap Memulai Transmisi</span>
                </div>

                <button id="btn-toggle-tracking" class="w-full sm:w-auto px-6 py-2.5 bg-orange-600 hover:bg-orange-500 text-white rounded-xl text-xs font-bold transition-all shadow-lg flex items-center justify-center space-x-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                    <span id="btn-text">Mulai Kirim Lokasi</span>
                </button>
            </div>
        </div>

        <!-- Peta Leaflet -->
        <div class="glass-card p-3 rounded-3xl border border-gray-800 shadow-2xl">
            <div id="map"></div>
        </div>

    </main>

    <!-- CUSTOM NOTIFICATION MODAL -->
    <div id="custom-notification" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm hidden">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl w-full max-w-sm p-6 text-center space-y-4 shadow-2xl m-4">
            <div id="notif-icon-container" class="w-12 h-12 mx-auto rounded-full flex items-center justify-center bg-orange-500/10 text-orange-400 border border-orange-500/20">
                <svg id="notif-svg" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <div>
                <h3 id="notif-title" class="text-base font-bold text-white mb-1">Pemberitahuan</h3>
                <p id="notif-message" class="text-xs text-gray-300 leading-relaxed">-</p>
            </div>
            <button id="notif-btn-ok" class="w-full py-2.5 bg-orange-600 hover:bg-orange-500 text-white rounded-xl text-xs font-semibold transition-all shadow-md">
                Mengerti
            </button>
        </div>
    </div>

    <!-- SCRIPT UTAMA -->
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const SUPABASE_URL = 'https://phpjaseuurpguhtzdvwy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBocGphc2V1dXJwZ3VodHpkdnd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODczNjYsImV4cCI6MjEwMjY2MzM2Nn0.DZvN_2ze96tgV3OuTWXpawe_g2YGWU7JWVJAfiQede4';

        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let map;
        let marker;
        let watchId = null;
        let isTracking = false;

        // Custom Notification Handler
        function showCustomNotification(title, message, isError = false) {
            const notifModal = document.getElementById('custom-notification');
            const notifTitle = document.getElementById('notif-title');
            const notifMsg = document.getElementById('notif-message');
            const iconContainer = document.getElementById('notif-icon-container');
            const notifSvg = document.getElementById('notif-svg');

            notifTitle.innerText = title;
            notifMsg.innerText = message;

            if (isError) {
                iconContainer.className = "w-12 h-12 mx-auto rounded-full flex items-center justify-center bg-rose-500/10 text-rose-400 border border-rose-500/20";
                notifSvg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>';
            } else {
                iconContainer.className = "w-12 h-12 mx-auto rounded-full flex items-center justify-center bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                notifSvg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>';
            }
            notifModal.classList.remove('hidden');
        }

        document.getElementById('notif-btn-ok').addEventListener('click', () => {
            document.getElementById('custom-notification').classList.add('hidden');
        });

        // Inisialisasi Peta Leaflet
        function initMap(lat = -6.2088, lng = 106.8456) {
            map = L.map('map').setView([lat, lng], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            marker = L.marker([lat, lng]).addTo(map)
                .bindPopup("<b>Posisi Anda (Road Captain)</b>")
                .openPopup();
        }

        initMap();

        // Ambil Daftar Jadwal Touring dari Database
        async function fetchTouringSchedules() {
            try {
                const { data, error } = await db
                    .from('touring_plans')
                    .select('id, nama_acara, tujuan')
                    .order('tanggal_berangkat', { ascending: true });

                if (error) throw error;

                const select = document.getElementById('select-touring');
                select.innerHTML = '<option value="">-- Pilih Jadwal Touring --</option>';

                if (data && data.length > 0) {
                    data.forEach(t => {
                        const opt = document.createElement('option');
                        opt.value = t.id;
                        opt.textContent = `${t.nama_acara} (${t.tujuan})`;
                        select.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error("Gagal mengambil jadwal touring:", err.message);
            }
        }

        fetchTouringSchedules();

        // Tombol Mulai/Berhenti Transmisi
        const btnToggle = document.getElementById('btn-toggle-tracking');
        const btnText = document.getElementById('btn-text');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');
        const selectTouring = document.getElementById('select-touring');

        btnToggle.addEventListener('click', () => {
            const touringId = selectTouring.value;
            if (!touringId) {
                showCustomNotification('Perhatian', 'Pilih jadwal touring terlebih dahulu sebelum memulai siaran.', true);
                return;
            }

            if (!isTracking) {
                if (!navigator.geolocation) {
                    showCustomNotification('Gagal', 'Browser Anda tidak mendukung Geolocation.', true);
                    return;
                }

                isTracking = true;
                btnText.innerText = 'Berhenti Kirim Lokasi';
                btnToggle.className = "w-full sm:w-auto px-6 py-2.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-bold transition-all shadow-lg flex items-center justify-center space-x-2";
                statusIndicator.className = "w-3 h-3 rounded-full bg-emerald-500 animate-pulse";
                statusText.innerText = 'Status: Mengirim Lokasi (Road Captain)...';
                selectTouring.disabled = true;

                watchId = navigator.geolocation.watchPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;

                        marker.setLatLng([lat, lng]);
                        map.setView([lat, lng], map.getZoom());

                        // Kirim ke Database (Pastikan tabel live_tracking atau disesuaikan dengan skema Anda)
                        try {
                            await db.from('live_tracking').upsert({
                                touring_id: touringId,
                                latitude: lat,
                                longitude: lng,
                                updated_at: new Date()
                            }, { onConflict: 'touring_id' });
                        } catch (err) {
                            console.error("Gagal update koordinat:", err.message);
                        }
                    },
                    (error) => {
                        showCustomNotification('GPS Error', 'Gagal mendapatkan sinyal GPS: ' + error.message, true);
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
                );

            } else {
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }

                isTracking = false;
                btnText.innerText = 'Mulai Kirim Lokasi';
                btnToggle.className = "w-full sm:w-auto px-6 py-2.5 bg-orange-600 hover:bg-orange-500 text-white rounded-xl text-xs font-bold transition-all shadow-lg flex items-center justify-center space-x-2";
                statusIndicator.className = "w-3 h-3 rounded-full bg-gray-500";
                statusText.innerText = 'Status: Transmisi Dihentikan';
                selectTouring.disabled = false;
            }
        });
    });
    </script>
</body>
</html>
