<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Tracking Touring - OneFrequency</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    #map { height: 75vh; width: 100%; border-radius: 0.5rem; }
  </style>
</head>
<body class="bg-gray-100 p-4">

  <div class="max-w-md mx-auto bg-white p-4 rounded-xl shadow-md mb-4">
    <h1 class="text-xl font-bold text-center mb-3 text-gray-800">Live Tracking Touring</h1>
    
    <!-- Pilihan Mode & Jadwal -->
    <div id="setup-panel" class="space-y-3">
      <div>
        <label class="block text-sm font-medium text-gray-700">Pilih Jadwal Touring:</label>
        <select id="touring-select" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
          <option value="">Memuat daftar touring...</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Pilih Peran Anda:</label>
        <select id="role-select" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
          <option value="member">Anggota (Hanya Pantau Peta)</option>
          <option value="rc">Road Captain (Kirim Lokasi GPS)</option>
        </select>
      </div>

      <button id="start-btn" class="w-full bg-blue-600 text-white p-2 rounded-lg font-semibold hover:bg-blue-700 transition">
        Mulai
      </button>
    </div>

    <!-- Info Status & Tombol Stop -->
    <div id="status-info" class="hidden text-center space-y-3 mt-2">
      <div class="text-sm text-green-600 font-medium">
        Status: <span id="status-text">Menunggu...</span>
      </div>
      <button id="stop-btn" class="w-full bg-red-600 text-white p-2 rounded-lg font-semibold hover:bg-red-700 transition">
        Berhenti Tracking
      </button>
    </div>
  </div>

  <!-- Peta -->
  <div class="max-w-4xl mx-auto bg-white p-2 rounded-xl shadow-md">
    <div id="map"></div>
  </div>

  <!-- Supabase & Leaflet JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // --- KONFIGURASI SUPABASE ---
    const SUPABASE_URL = 'https://phpjaseuurpguhtzdvwy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBocGphc2V1dXJwZ3VodHpkdnd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODczNjYsImV4cCI6MjEwMjY2MzM2Nn0.DZvN_2ze96tgV3OuTWXpawe_g2YGWU7JWVJAfiQede4';
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const touringIdFromURL = urlParams.get('touring_id');

    let selectedTouringId = touringIdFromURL;
    let watchId = null; // Menyimpan ID geolocation watch agar bisa di-stop

    // Inisialisasi Peta Leaflet
    const map = L.map('map').setView([-6.2000, 106.8166], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let marker = null;
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const roleSelect = document.getElementById('role-select');
    const touringSelect = document.getElementById('touring-select');
    const setupPanel = document.getElementById('setup-panel');
    const statusInfo = document.getElementById('status-info');
    const statusText = document.getElementById('status-text');

    if (touringIdFromURL) {
      touringSelect.parentElement.style.display = 'none';
    } else {
      loadTouringPlans();
    }

    async function loadTouringPlans() {
      const { data, error } = await supabaseClient.from('touring_plans').select('*');
      touringSelect.innerHTML = '';
      if (error) {
        touringSelect.innerHTML = '<option value="">Gagal memuat jadwal</option>';
        return;
      }
      if (data && data.length > 0) {
        touringSelect.innerHTML = '<option value="">-- Pilih Jadwal Touring --</option>';
        data.forEach(tour => {
          const opt = document.createElement('option');
          opt.value = tour.id;
          opt.textContent = tour.name || tour.title || `Touring ID: ${tour.id.substring(0, 8)}...`;
          touringSelect.appendChild(opt);
        });
      } else {
        touringSelect.innerHTML = '<option value="">Tidak ada jadwal touring</option>';
      }
    }

    startBtn.addEventListener('click', () => {
      if (!selectedTouringId) {
        selectedTouringId = touringSelect.value;
      }
      
      if (!selectedTouringId) {
        alert('Jadwal touring belum ditentukan atau dipilih!');
        return;
      }

      const role = roleSelect.value;
      setupPanel.classList.add('hidden');
      statusInfo.classList.remove('hidden');

      if (role === 'rc') {
        statusText.innerText = 'Mengirim Lokasi (Road Captain)...';
        initRoadCaptain(selectedTouringId);
      } else {
        statusText.innerText = 'Memantau Posisi Road Captain...';
        initMember(selectedTouringId);
      }
    });

    // Tombol Berhenti Tracking
    stopBtn.addEventListener('click', () => {
      // Hentikan pengiriman GPS jika aktif
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      // Putuskan koneksi realtime supabase
      supabaseClient.removeAllChannels();

      alert('Tracking dihentikan.');
      window.location.reload(); // Muat ulang halaman ke kondisi awal
    });

    // 1. Fungsi untuk Road Captain (Mengirim GPS)
    function initRoadCaptain(touringId) {
      if (!navigator.geolocation) {
        alert('Browser Anda tidak mendukung Geolocation.');
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          const { error } = await supabaseClient
            .from('touring_locations')
            .upsert({
              touring_id: touringId,
              nra: 'RC-001',
              latitude: lat,
              longitude: lng,
              updated_at: new Date()
            }, { onConflict: 'touring_id' });

          if (!error) {
            updateMapMarker(lat, lng, '<b>Posisi Anda (Road Captain)</b>');
          }
        },
        (error) => alert('Gagal mengambil GPS: ' + error.message),
        { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 }
      );
    }

    // 2. Fungsi untuk Member (Menerima Realtime Data)
    function initMember(touringId) {
      fetchInitialLocation(touringId);

      supabaseClient
        .channel('public:touring_locations')
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'touring_locations',
            filter: `touring_id=eq.${touringId}`
          },
          (payload) => {
            const { latitude, longitude } = payload.new;
            updateMapMarker(latitude, longitude, '<b>Road Captain (Bergerak)</b>');
          }
        )
        .subscribe();
    }

    async function fetchInitialLocation(touringId) {
      const { data } = await supabaseClient
        .from('touring_locations')
        .select('*')
        .eq('touring_id', touringId)
        .single();

      if (data) {
        updateMapMarker(data.latitude, data.longitude, '<b>Road Captain</b>');
      }
    }

    function updateMapMarker(lat, lng, popupText) {
      if (!marker) {
        marker = L.marker([lat, lng]).addTo(map).bindPopup(popupText).openPopup();
      } else {
        marker.setLatLng([lat, lng]);
        marker.setPopupContent(popupText);
      }
      map.panTo([lat, lng]);
    }
  </script>
</body>
</html>
