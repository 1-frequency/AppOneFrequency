<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ONE Frequency</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f19] text-white font-sans antialiased flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md p-8 bg-[#121826] border border-gray-800 rounded-2xl shadow-2xl text-center">
        <!-- Logo / Header -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold tracking-wider text-orange-500">ONE <span class="text-white">Frequency</span></h1>
            <p class="text-sm text-gray-400 mt-2">Dashboard Keuangan & Manajemen Touring</p>
        </div>

        <!-- Pilihan Menu Awal -->
        <div id="role-selection" class="space-y-4">
            <p class="text-sm font-medium text-gray-300 mb-4">Silakan pilih akses masuk:</p>
            
            <!-- Tombol Member -->
            <button onclick="loginAsMember()" class="w-full py-3 px-4 bg-[#1f293d] hover:bg-[#2a374e] border border-gray-700 rounded-xl font-medium transition duration-200 flex items-center justify-center space-x-2 text-gray-200">
                <span>👤 Masuk sebagai Member</span>
            </button>

            <!-- Tombol Admin -->
            <button onclick="showAdminPasswordInput()" class="w-full py-3 px-4 bg-orange-600 hover:bg-orange-700 rounded-xl font-medium transition duration-200 shadow-lg shadow-orange-600/20 flex items-center justify-center space-x-2 text-white">
                <span>🔐 Masuk sebagai Admin</span>
            </button>
        </div>

        <!-- Form Password Admin (Hidden Default) -->
        <div id="admin-login-form" class="hidden space-y-4 text-left">
            <button onclick="backToSelection()" class="text-xs text-orange-400 hover:underline mb-2 flex items-center">
                &larr; Kembali ke pilihan
            </button>
            <h3 class="text-lg font-semibold text-white">Verifikasi Admin</h3>
            <p class="text-xs text-gray-400">Masukkan password khusus pengurus/bendahara.</p>
            
            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1">Password Admin</label>
                <input type="password" id="adminPassword" placeholder="Masukkan password..." class="w-full px-4 py-2.5 bg-[#0b0f19] border border-gray-700 rounded-xl text-white text-sm focus:outline-none focus:border-orange-500">
                <p id="error-msg" class="text-xs text-red-500 mt-1 hidden">Password salah! Silakan coba lagi.</p>
            </div>

            <button onclick="verifyAdmin()" class="w-full py-3 px-4 bg-orange-600 hover:bg-orange-700 rounded-xl font-medium transition duration-200 text-white shadow-lg">
                Konfirmasi & Masuk
            </button>
        </div>
    </div>

    <!-- JavaScript untuk Interaksi -->
    <script>
        const correctPassword = "admin123"; // Ganti dengan password yang Anda inginkan

        function loginAsMember() {
            // Arahkan ke halaman utama dashboard (misal: dashboard.html)
            window.location.href = "dashboard.html"; 
        }

        function showAdminPasswordInput() {
            document.getElementById('role-selection').classList.add('hidden');
            document.getElementById('admin-login-form').classList.remove('hidden');
        }

        function backToSelection() {
            document.getElementById('admin-login-form').classList.add('hidden');
            document.getElementById('role-selection').classList.remove('hidden');
            document.getElementById('error-msg').classList.add('hidden');
            document.getElementById('adminPassword').value = '';
        }

        function verifyAdmin() {
            const pass = document.getElementById('adminPassword').value;
            const errorMsg = document.getElementById('error-msg');

            if (pass === correctPassword) {
                // Arahkan ke halaman dashboard khusus admin
                window.location.href = "dashboard-admin.html"; // Atau ke dashboard utama dengan hak akses admin
            } else {
                errorMsg.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
