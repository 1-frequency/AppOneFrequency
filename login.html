<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ONE Frequency</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="text-white font-sans antialiased flex items-center justify-center min-h-screen relative" style="background-image: url('1.Frequensi.png'); background-size: contain; background-position: center; background-repeat: no-repeat; background-color: #07090e;">

    <!-- Dark Overlay agar teks dan tombol tetap jelas terbaca -->
    <div class="absolute inset-0 bg-black/75 backdrop-blur-[2px]"></div>

    <!-- Konten Login (Tanpa Kotak) -->
    <div class="relative z-10 w-full max-w-sm p-6 text-center">
        <!-- Logo / Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold tracking-wider text-orange-500 drop-shadow-md">ONE <span class="text-white">Frequency</span></h1>
            <p class="text-xs text-gray-300 mt-1.5 drop-shadow">Dashboard Keuangan & Manajemen Touring</p>
        </div>

        <!-- Pilihan Menu Awal -->
        <div id="role-selection" class="space-y-3">
            <p class="text-xs font-medium text-gray-300 mb-3 drop-shadow">Silakan pilih akses masuk:</p>
            
            <!-- Tombol Member -->
            <button onclick="loginAsMember()" class="w-full py-2.5 px-4 bg-[#121826]/80 hover:bg-[#1f293d] border border-gray-700/85 rounded-xl text-sm font-medium transition duration-200 flex items-center justify-center space-x-2 text-gray-200 backdrop-blur-md shadow-md">
                <span>👤 Masuk sebagai Member</span>
            </button>

            <!-- Tombol Admin -->
            <button onclick="showAdminPasswordInput()" class="w-full py-2.5 px-4 bg-orange-600 hover:bg-orange-700 rounded-xl text-sm font-medium transition duration-200 shadow-md shadow-orange-600/30 flex items-center justify-center space-x-2 text-white">
                <span>🔐 Masuk sebagai Admin</span>
            </button>
        </div>

        <!-- Form Password Admin (Hidden Default) -->
        <div id="admin-login-form" class="hidden space-y-3 text-left bg-[#121826]/85 p-5 rounded-xl border border-gray-700 backdrop-blur-md shadow-2xl">
            <button onclick="backToSelection()" class="text-xs text-orange-400 hover:underline mb-1 flex items-center">
                &larr; Kembali ke pilihan
            </button>
            <h3 class="text-base font-semibold text-white">Verifikasi Admin</h3>
            <p class="text-xs text-gray-300">Masukkan password khusus pengurus/bendahara.</p>
            
            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1">Password Admin</label>
                <input type="password" id="adminPassword" placeholder="Masukkan password..." class="w-full px-3 py-2 bg-[#0b0f19] border border-gray-700 rounded-lg text-white text-xs focus:outline-none focus:border-orange-500">
                <p id="error-msg" class="text-xs text-red-400 mt-1 hidden">Password salah! Silakan coba lagi.</p>
            </div>

            <button onclick="verifyAdmin()" class="w-full py-2.5 px-4 bg-orange-600 hover:bg-orange-700 rounded-lg text-xs font-medium transition duration-200 text-white shadow-md">
                Konfirmasi & Masuk
            </button>
        </div>
    </div>

    <!-- JavaScript untuk Interaksi & Routing -->
    <script>
        const correctPassword = "admin123"; // Anda bisa ubah password admin di sini

        function loginAsMember() {
            // Mengarahkan ke halaman index.html untuk member
            window.location.href = "index.html"; 
        }

        function showAdminPasswordInput() {
            document.getElementById('role-selection').classList.add('hidden');
            document.getElementById('admin-login-form').classList.remove('hidden');
        }

        function backToSelection() {
            document.getElementById('admin-login-form').classList.add('hidden');
            document.getElementById('role-selection').classList.remove('hidden');
            document.getElementById('error-msg').classList.add('hidden');
            document.getElementById('adminPassword').value = '';
        }

        function verifyAdmin() {
            const pass = document.getElementById('adminPassword').value;
            const errorMsg = document.getElementById('error-msg');

            if (pass === correctPassword) {
                // Mengarahkan ke halaman admin.html jika password benar
                window.location.href = "admin.html"; 
            } else {
                errorMsg.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
